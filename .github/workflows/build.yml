name: Build TV APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build TV(leanback)
        run: ./gradlew assembleLeanbackUniversalRelease

      - name: Build Mobile
        run: ./gradlew assembleMobileUniversalRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK
          path: app/build/outputs/apk/release/*.apk
